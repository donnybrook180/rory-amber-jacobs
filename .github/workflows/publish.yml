name: Build & publish CDN

# Refreshes index.json and publishes the word data to GitHub Pages (served from
# this repo's root). Triggers on the published content itself, not just on the
# tooling: word data is generated out-of-band and committed directly, so a fix
# to a <lang>/words.*.json is a publishable change on its own. Before this, such
# a commit landed on main and never deployed, and the only way out was bumping a
# dummy trigger comment in one of the watched paths.
#
# The `index.json` entry is safe against a self-trigger loop: the bot commit
# below is tagged [skip ci].
on:
  push:
    branches: [main]
    paths:
      - "*/manifest.json"        # <lang>/manifest.json — `*` does not cross `/`
      - "*/words.*.json"         # <lang>/words.<code>.json
      - "examples/**"
      - "index.json"
      - "resources/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

permissions:
  contents: write      # commit regenerated JSON back
  pages: write         # deploy Pages
  id-token: write      # required by deploy-pages

concurrency:
  group: publish-cdn
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Refresh index.json (discovery only)
        # The committed JSON is the source of truth — word data is generated
        # out-of-band (Excel masters via build_all, plus tools/gen_lang_content.py
        # for the rest) and may be hand-enriched after import. Do NOT re-import
        # here: that would clobber enrichment with stale Excel output. Just rebuild
        # index.json from whatever <lang>/manifest.json files are committed.
        run: python tools/build_all.py --index-only

      - name: Commit refreshed index.json
        run: |
          git config user.name  "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged."
          else
            git commit -m "chore(content): refresh index.json [skip ci]"
            git push
          fi

      - name: Stage publishable files only
        # Serve just index.json + the language folders — keep resources/ and tools/
        # out of the published site.
        run: |
          rm -rf _public && mkdir _public
          cp index.json _public/
          python - <<'PY'
          import json, os, shutil
          idx = json.load(open("index.json", encoding="utf-8"))
          for app in idx["apps"]:
              shutil.copytree(app["path"], f"_public/{app['path']}")
          # Example shards live at repo root (examples/<code>/<pack>.json),
          # lazy-fetched by the app — publish them too.
          if os.path.isdir("examples"):
              shutil.copytree("examples", "_public/examples")
          print("staged:", [a["path"] for a in idx["apps"]],
                "+examples" if os.path.isdir("examples") else "")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

